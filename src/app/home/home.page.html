<ion-header>
  <ion-toolbar>
    <ion-title>LogiTrack Express</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-select
      label="Prioridad"
      aria-label="Filtrar por prioridad"
      interface="popover"
      [value]="priorityFilter()"
      (ionChange)="onPriorityChange($event)"
    >
      @for (option of priorityFilters; track option) {
      <ion-select-option [value]="option">{{ filterLabel[option] }}</ion-select-option>
      }
    </ion-select>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      aria-label="Buscar por código de seguimiento"
      placeholder="Buscar código LTK-…"
      [debounce]="0"
      (ionInput)="onSearch($event)"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (pkg of filteredPackages(); track pkg.id) {
    <ion-item-sliding>
      <ion-item class="pkg" lines="none">
        <app-package-item [package]="pkg" (statusChange)="onStatusChange($event)"></app-package-item>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="success" (click)="onStatusChange({ id: pkg.id, newStatus: 'INSPECTED' })"
          >Inspeccionar</ion-item-option
        >
        <ion-item-option color="danger" (click)="onStatusChange({ id: pkg.id, newStatus: 'REJECTED' })"
          >Rechazar</ion-item-option
        >
      </ion-item-options>
    </ion-item-sliding>
    } @empty {
    <ion-item lines="none">
      <ion-label class="empty" aria-live="polite">No hay paquetes que coincidan con la búsqueda.</ion-label>
    </ion-item>
    }
  </ion-list>
</ion-content>
